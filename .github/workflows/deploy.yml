name: Deploy Angular Portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./meu-portfolio

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./meu-portfolio/package-lock.json

      - name: Instalar Dependências
        run: npm ci

      - name: Build do Projeto Angular
        run: npx ng build --base-href=/

      - name: Upload dos arquivos buildados
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./meu-portfolio/dist/meu-portfolio/browser

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4